<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador 3D</title>
  <link rel="stylesheet" href="simulador.css">
  <script type="importmap">
    {"imports": {"three": "./vendor/three.module.min.js", "three/addons/": "./vendor/"}}
  </script>
  <script type="module" src="simulador.js"></script>
</head>
<body>
  <canvas id="lienzo"></canvas>
  <div id="etiquetas"></div>
  <div id="cargando">Cargando texturas…</div>

  <aside id="ficha" class="caja" hidden>
    <span class="etiqueta-ficha" id="tipo-ficha"></span>
    <h1 id="nombre"></h1>
    <dl id="datos-ficha"></dl>
    <p id="nota-ficha" class="nota" hidden></p>
  </aside>

  <nav id="vistas" class="caja" hidden>
    <div class="grupo" id="botones-seguir" role="group" aria-label="Seguir con la cámara">
      <button data-seguir="general" class="activo">General</button>
      <button data-seguir="tierra">Tierra</button>
      <button data-seguir="luna">Luna</button>
      <button data-seguir="asteroide">Asteroide</button>
    </div>
    <label class="interruptor" id="control-exagerar"><input type="checkbox" id="exagerar" checked> <span id="texto-exagerar">Tamaños exagerados</span></label>
    <label class="interruptor"><input type="checkbox" id="ver-bolidos" checked> Bólidos</label>
    <label class="interruptor"><input type="checkbox" id="ver-orbitas" checked> Órbitas de satélites</label>
  </nav>

  <footer id="tiempo" class="caja" hidden>
    <button id="reproducir" aria-label="Pausar">❚❚</button>
    <input id="barra" type="range" min="0" max="1000" value="0" aria-label="Instante">
    <select id="velocidad" aria-label="Velocidad">
      <option value="60">1 min/s</option>
      <option value="600">10 min/s</option>
      <option value="3600" selected>1 h/s</option>
      <option value="21600">6 h/s</option>
    </select>
    <div class="lecturas">
      <span id="ahora"></span>
      <span id="cuenta"></span>
      <span id="distancia"></span>
      <span id="rapidez"></span>
    </div>
  </footer>

  <div id="tooltip" class="caja" hidden></div>

  <small id="creditos">Posiciones: JPL Horizons · Bólidos: CNEOS · Texturas: NASA (Blue Marble, Black Marble, LRO, SVS Deep Star Maps) · El asteroide es una roca genérica</small>
</body>
</html>
